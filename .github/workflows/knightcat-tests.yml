name: KnightCat tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vk-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run VK publisher tests
        run: node --test n8n/vk/vk-publisher.test.cjs

  aaif-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run AAIF pilot tests
        run: node --test pilot/model-gateway/gateway.test.mjs pilot/opensandbox-poc/runner.test.mjs
